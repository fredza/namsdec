[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/namsdec-gui"]

[workspace.package]
edition = "2024"
# Ne JAMAIS monter ce numéro sans demander d'abord à l'utilisateur — règle
# explicite (voir memory: feedback_version_bump_approval). Le numéro de
# build (date de compilation) n'est pas concerné, il se met à jour seul.
version = "0.2.9-beta.3"
license = "MIT"

[workspace.dependencies]
namsdec-core = { path = "crates/namsdec-core" }
namsdec-asm = { path = "crates/namsdec-asm" }
namsdec-disasm = { path = "crates/namsdec-disasm" }
namsdec-emu = { path = "crates/namsdec-emu" }
namsdec-re = { path = "crates/namsdec-re" }
namsdec-exercises = { path = "crates/namsdec-exercises" }
namsdec-doc = { path = "crates/namsdec-doc" }
namsdec-theme = { path = "crates/namsdec-theme" }
namsdec-explorer = { path = "crates/namsdec-explorer" }
# `default-features = false` : c'est `namsdec-gui` qui décide, par sa
# propre option `reseau`. Sans cela, le crate activerait sa pile TLS
# quoi qu'on demande, et l'option ne servirait à rien.
namsdec-update = { path = "crates/namsdec-update", default-features = false }

egui = "0.36"
# `links` : sans elle, `open_url` ne fait **rien** — les liens de la
# boîte « À propos » et des fenêtres d'analyse s'enfonçaient en silence.
# Elle fait partie des `default` d'eframe, que nous n'activons pas.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui_code_editor = "0.4"
# À l'essai : voir le contrôle `kittest_*` de namsdec-gui.
# `wgpu` + `snapshot` : de quoi RENDRE une image d'une scène, et non
# seulement la mesurer. Sans cela, les écrans qui n'apparaissent qu'au
# clavier — la palette, les suites d'une séquence — ne peuvent pas être
# regardés du tout : sous Wayland, l'injection de touches par XTEST
# n'atteint pas la fenêtre, et GNOME ne donne pas le focus à une fenêtre
# qu'on vient de lancer. Le rendu passe par lavapipe (Vulkan logiciel),
# donc sans écran, sans carte graphique et sans droits.
#
# En dev-dependency uniquement : rien de tout cela n'entre dans le
# programme livré.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
# Pour écrire les images rendues. Déjà tirée par `egui_kittest`.
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
rfd = "0.17"
# `gas` en plus de `nasm` : la syntaxe du système — celle de gdb, objdump
# et as. Deux formateurs pèsent plus qu'un, et c'est le prix de lire un
# rapport d'outil sans le retraduire de tête.
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "nasm", "gas", "instr_info"] }
# `kill(2)` sur un GROUPE de processus : c'est la seule façon qu'un
# délai atteigne la descendance d'un outil extérieur. Déjà dans l'arbre
# par les dépendances de fenêtrage ; la nommer ne tire rien de neuf.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
bitflags = "2"
tempfile = "3"
regex = "1"
# Client HTTP minimal, synchrone : la recherche de mise à jour tient dans
# un thread, et il n'y a rien à gagner à tirer tout un exécuteur async
# pour une requête par session.
ureq = { version = "3", features = ["json"] }

[profile.dev.package."*"]
opt-level = 1

# Le binaire livré : aussi petit et aussi rapide que possible **sans
# rien effacer**. Pas de `strip` : les symboles servent à lire un
# rapport de plantage, et un atelier d'apprentissage doit pouvoir
# expliquer même sa propre panne.
#
# `lto = "fat"` et une seule unité de génération laissent le compilateur
# voir tout le programme d'un coup : il jette ce qui n'est appelé nulle
# part — et une bibliothèque d'interface en contient beaucoup.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
