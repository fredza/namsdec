# Ce qui doit tenir à chaque poussée : la mise en forme, clippy sans
# indulgence, et tous les tests — y compris ceux qui appellent le vrai
# nasm et lisent de vrais binaires.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Une poussée de plus rend la précédente sans objet : inutile de faire
# tourner six fois la même vérification sur six commits d'affilée, et
# les runners ne sont pas infinis.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # La version est ÉPINGLÉE, et non `ubuntu-latest`.
    #
    # `what_this_machine_runs_can_be_explained` désassemble soixante
    # binaires de /usr/bin et exige une fiche pour chaque mnémonique
    # rencontré. C'est voulu — un échec y est une liste de fiches à
    # écrire, non un défaut de l'application —, mais cela veut dire que
    # la CI dépend des binaires du coureur.
    #
    # `ubuntu-latest` bascule vers Ubuntu 26 le 19 octobre 2026 :
    # d'autres binaires, d'autres instructions, et une CI rouge un matin
    # sans qu'une ligne du dépôt ait changé. Épingler la version rend le
    # résultat reproductible ; monter d'une version devient alors un
    # geste qu'on fait exprès, et dont on écrit les fiches.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer nasm et binutils
        run: sudo apt-get update && sudo apt-get install -y nasm binutils

      - name: Installer les bibliothèques de fenêtrage
        run: >
          sudo apt-get install -y
          libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
