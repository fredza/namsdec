[package]
name = "namsdec-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# La recherche de mise à jour. Activée par défaut — c'est l'application
# livrée. Sans elle, le binaire perd la pile TLS, qui pèse à elle seule
# autant que tout le code de namsdec ; le menu n'en montre alors pas
# l'entrée, plutôt que d'offrir un bouton qui ne peut rien faire.
default = ["reseau"]
reseau = ["namsdec-update/reseau"]

[dependencies]
namsdec-core.workspace = true
namsdec-asm.workspace = true
namsdec-disasm.workspace = true
namsdec-emu.workspace = true
namsdec-re.workspace = true
namsdec-theme.workspace = true
namsdec-explorer.workspace = true
namsdec-update.workspace = true
namsdec-doc.workspace = true
namsdec-exercises.workspace = true
eframe.workspace = true
egui.workspace = true
arboard.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
# Le fichier temporaire sur lequel upx travaille : une copie du binaire
# ouvert, pour que `upx -d` n'écrase jamais l'échantillon. Déjà dans le
# binaire par namsdec-disasm, qui s'en sert pour les outils extérieurs —
# le promouvoir depuis les dépendances de test ne coûte donc rien.
tempfile.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
image.workspace = true
